day_id: 2026-08-09
weather: 盛夏晴热、午后偶有阵雨
season: 盛夏

seasonal_world:
  rainbow_lake:
    - 荷花沿湖畔进入盛花期，清晨花瓣留露水，午后荷叶下藏着凉风。
    - 兔兔们会相约赏荷、画荷花、收集倒影，也会挪遮阳伞和晾湿手帕。
    - 进入8月后开始看见小莲蓬，雨后偶尔有蜻蜓停在木栏和荷梗上。
  rabbit_mountain:
    - 盛夏森林树荫浓密，浅溪水温凉，午后偶尔有短阵雨。
    - 兔兔们偶尔结伴露营、溯溪、野餐和观星，暑气最重时会先在树荫下休息。
    - 雨后傍晚草丛会亮起零星萤光，清晨山路比7月底稍微凉一点。
  group_activities:
    - 露营
    - 溯溪
    - 赏荷
    - 观星

