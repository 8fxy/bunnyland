# Generated from index.html mapConfig roads. Update with: node scaffold/tools/generate_travel_times.js
travel_time_model:
  source: index.html mapConfig.roads polyline length
  algorithm: shortest_path_on_road_graph
  pixels_per_tick: 35
  min_duration_ticks: 4
  formula: duration_ticks = max(4, round(distance_px / 35))
  tick_interval_seconds: 10
  agent_rule: move.end_tick = move.start_tick + duration_ticks from all_pairs for the unordered from/to pair

