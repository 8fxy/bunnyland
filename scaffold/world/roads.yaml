notes:
  - 事件里的 from/to 使用地点 id，不使用道路 id。
  - 无直达道路的地点移动可以跨多条道路，但剧情上要写成合理换乘，不要写成穿越空白区域。
  - road id 只用于校验地图连通关系和提示 agent 理解地理结构。
