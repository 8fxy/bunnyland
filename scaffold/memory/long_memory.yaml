    - 记得灯塔门铃、借阅卡背面铅笔字和旧地图能接上海湾线索。
    - 记得香颂音乐厅小演出需要提前留甜点和座位。
    - 记得劳伦斯常把甜点打包回北欧，也常听错乔治的口头禅。
    - 记得自己的生日进入远远倒数时，大家会冒出礼物灵感。
    - 记得这一天一直活动到23:50才开始回树屋睡觉。
