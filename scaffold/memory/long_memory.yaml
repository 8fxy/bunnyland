long_term_memory:
  rabbit_1:
    - 记得白天穿蜜蜂服采蜜，晚上整理树叶鲜花图鉴。
    - 记得植物园、蘑菇咖啡馆和海湾经常串成自己的探险路线。
    - 记得把星象纸条、借阅卡铅笔字和灯塔小册子都当作图鉴素材。
    - 记得贝壳像花瓣，海湾潮声会把灯塔方向说得很轻。
    - 记得给杰拉德留稀有花，也会把花样本交给晓雪做发带。
    - 记得自己不是迷路，而是在发现新路线。
    - 记得音乐厅开场曲、慢钟和旧地图都可能藏着新花线索。
    - 记得这一天一直活动到23:50才开始回树屋睡觉。
  rabbit_2:
