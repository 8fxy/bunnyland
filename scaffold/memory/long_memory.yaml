    - 记得植物园薄荷是自己的巡逻重点，薄荷叶像蓝帽子。
    - 记得齿轮工坊慢钟、灯塔门铃和路牌都能变成乔老爷的新任务。
    - 记得小泽会把自己吃瘪的表情拉进奶泡，也会收走薄荷做新品。
    - 记得晓雪的法语和浓缩咖啡能让自己先冷静解释。
    - 记得公告牌不一定懂自己，但公告线索总能把大家聚到广场。
    - 记得修门铃时要先说明自己说的是手表，不是叫劳伦斯。
    - 记得这一天一直活动到23:50才开始回树屋睡觉。
