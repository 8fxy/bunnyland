characters:
  rabbit_1:
    name: 小悠米
    gender: 女
    birthday: 3月28日
    color: "#fff4f4"
    scale: 0.8
    home: tree_house
    appearance: 小小的可爱白色垂耳兔，爱穿蜜蜂服。
    personality: 勇敢、好奇、容易迷路但很有探索精神。
    bio: 白天做蜜蜂去采蜜，晚上又变成兔兔；梦想成为旅行家，记录世界上所有的鲜花种类。
    important_items:
      - 用树叶做成的《世界鲜花图鉴》
      - 蜜蜂服
    story_hooks:
      - 白天采蜜，晚上回树屋整理花卉记录
      - 把稀有花朵带给杰拉德当绘画素材
      - 偶尔迷路到小泽咖啡馆糖罐或晓雪耳朵上
      - 初夏去彩虹湖赏荷，也会参加兔耳山露营
      - 世界杯期间支持巴西，赢球后会把比分画进鲜花图鉴
    world_cup_team: 巴西
    relationships:
      rabbit_5: 是杰拉德的灵感缪斯，常把花带给他画。
      rabbit_4: 会把采来的花给晓雪尝试扎染发带。
      rabbit_3: 容易飞到小泽咖啡馆的糖罐上。

  rabbit_2:
    name: 乔治
    aliases: [乔老爷]
    gender: 男
    birthday: 11月3日
    birthplace: 山东
    color: "#7bdff2"
    scale: 1
    home: tree_house
    appearance: 戴蓝色帽子、穿蓝色背带裤的小白兔。
    personality: 调皮开朗、古灵精怪、鬼点子多。
    bio: 很喜欢植物园，喜欢晓雪。最近迷恋劳力士手表，经常大喊“给我劳”，让劳伦斯误以为乔治对他有异样的感情。
    story_hooks:
      - 在植物园照看薄荷和各种植物
      - 大喊“给我劳”引发劳伦斯误会
      - 被晓雪一杯苦涩浓缩咖啡治住
      - 世界杯期间支持美国，主队赢球会让他一整天更得意
    world_cup_team: 美国
    relationships:
      rabbit_4: 喜欢晓雪，也最听晓雪的话。
      rabbit_6: 因“给我劳”口头禅被劳伦斯误会。
      rabbit_3: 给小泽咖啡馆友情提供植物园薄荷。

  rabbit_3:
    name: 小泽
    gender: 男
    birthday: 7月12日
    birthplace: 山东
    color: "#f9c74f"
    scale: 1
    home: tree_house
    appearance: 安静的美男兔，精致但骨子里豪爽。
    personality: 热心、有生活情调、安静温柔、隐形富豪精致boy。
    bio: 喜欢度假，在 Bunnyland 开了一家咖啡馆，擅长甜点和咖啡；咖啡馆是整个 Bunnyland 的信息情报站。
    signature:
      - 能把每杯咖啡奶泡拉成在场兔兔的头像
      - 尤其喜欢拉乔治吃瘪的表情
    story_hooks:
      - 用乔治植物园提供的薄荷做咖啡
      - 新品发布会邀请晓雪拍照推广
      - 端着咖啡看报纸，旁听劳伦斯和乔治的抓马
      - 初夏夜晚把咖啡馆布置成世界杯看球点
      - 支持比利时，并为不同比赛准备对应甜点
    world_cup_team: 比利时
    relationships:
      rabbit_2: 使用乔治提供的薄荷，也爱观察乔治吃瘪。
      rabbit_4: 推新品时总邀请晓雪拍照推广。
      rabbit_5: 咖啡馆招牌由杰拉德绘制。
      rabbit_6: 常听劳伦斯讲乔治误会事件。

  rabbit_4:
    name: 晓雪
    gender: 女
    birthday: 10月9日
    birthplace: 扬州
    color: "#95d5b2"
    scale: 1
    home: tree_house
    appearance: Bunnyland 最乖的垂耳兔小公主，薄荷绿色皮毛，有很多小裙子。
    personality: 聪慧安静、甜美可爱、乖巧但能治住乔治。
    languages: [法语, 中文]
    bio: 喜欢乔治，热衷收集各式发带装饰耳朵，有专门存放发带的微型衣帽间；最近用小悠米采蜜带回来的植物花卉自己扎染发带。
    hidden_skill: 法式浪漫吐槽。乔治调皮过头时会用极快法语语速优雅碎碎念，乔治听不懂只能点头。
    story_hooks:
      - 收集发带并经营微型衣帽间
      - 用植物花卉扎染发带
      - 乔治大喊“给我劳”时递上苦涩浓缩咖啡
      - 初夏会去彩虹湖赏荷、兔耳山溯溪和观星
      - 世界杯期间支持法国，会用法语点评比赛
    world_cup_team: 法国
    relationships:
      rabbit_2: 喜欢乔治，也是唯一能治住乔治的人。
      rabbit_1: 使用小悠米带回来的花卉扎染发带。
      rabbit_7: 经常请 Lino 拍发带穿搭街拍。

  rabbit_5:
    name: 杰拉德
    gender: 男
    birthday: 12月7日
    color: "#cdb4db"
    scale: 0.8
    home: tree_house
    appearance: 有艺术家忧郁气质的小兔兔。
    personality: 想象力丰富、爱画画、喜欢冬天，常把日常画成奇幻冒险。
    bio: 劳伦斯把他当亲弟弟照顾，并且过度保护；劳伦斯去山东后疯狂喂他吃鲁菜，导致他苦恼怎么一边保持艺术家气质一边减肥。
    story_hooks:
      - 把大家日常画成奇幻冒险故事
      - 给小泽咖啡馆画招牌
      - 被劳伦斯投喂鲁菜后思考艺术家减肥
      - 喜欢在初夏森林露营，把荷花和星空画进故事
      - 世界杯期间支持荷兰，平局会让他的画面更忧郁
    world_cup_team: 荷兰
    relationships:
      rabbit_6: 被劳伦斯当亲弟弟过度保护。
      rabbit_1: 小悠米是他的灵感缪斯。
      rabbit_3: 为小泽咖啡馆画招牌。

  rabbit_6:
    name: 劳伦斯
    gender: 男
    birthday: 1月18日
    birthplace: 北欧
    color: "#f4a261"
    scale: 1.2
    home: tree_house
    appearance: 高大沉稳，经常穿得很保暖；夏天厚毛衣热到耳朵耷拉。
    personality: 沉稳可靠、照顾人、容易把乔治的“给我劳”想歪。
    bio: 后来来到山东生活，爱上中国美食，尤其疯狂迷恋山东大葱蘸酱和煎饼果子。每年圣诞节会返回北欧做圣诞老人，12月开始用棉花贴胡子，并打包小泽咖啡馆甜点带回北欧当礼物。
    story_hooks:
      - 夏天穿厚毛衣导致耳朵耷拉
      - 吃山东大葱蘸酱和煎饼果子
      - 误会乔治的“给我劳”
      - 圣诞节回北欧做圣诞老人
      - 初夏会负责露营装备、溯溪安全和夜间点名
      - 世界杯期间支持挪威，比赛前会认真整理战术和零食
    world_cup_team: 挪威
    relationships:
      rabbit_2: 因乔治中央空调和“给我劳”口头禅产生误会。
      rabbit_5: 把杰拉德当亲弟弟过度保护。
      rabbit_3: 圣诞节会打包小泽咖啡馆甜点。

  rabbit_7:
    name: Lino
    aliases: [lino]
    gender: 男
    birthday: 6月2日
    birthplace: 意大利乌迪内省塔尔琴托
    species: 棕色野兔
    color: "#9b7653"
    scale: 1
    home: tree_house
    appearance: 棕色野兔，安静时像背景板；撒娇时耳朵会卷成两个心形。
    personality: 温顺、热爱摄影、看着内向但喜欢撒娇。
    bio: 和狗狗是好朋友，经常帮晓雪拍发带穿搭街拍照，也是唯一用镜头捕捉到“乔治向劳伦斯解释现场”的吃瓜群众。
    story_hooks:
      - 给晓雪拍发带穿搭街拍
      - 用镜头记录乔治向劳伦斯解释的现场
      - 撒娇时耳朵卷成心形
      - 和狗狗是好朋友
      - 初夏会拍荷花、溪水、露营灯和山顶星空
      - 世界杯期间支持日本，会记录绝平和安静庆祝的瞬间
    world_cup_team: 日本
    relationships:
      rabbit_4: 经常帮晓雪拍发带穿搭。
      rabbit_2: 拍到乔治解释“给我劳”的名场面。
      rabbit_6: 拍到劳伦斯误会乔治后的反应。
