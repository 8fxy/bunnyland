<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D 像素风 AI剧剧场 Demo</title>
  <style>
    /* === 基础样式与复古像素UI === */
    :root {
      --bg-color: #1a1a1a;
      --panel-bg: #2a2a2a;
      --text-color: #e0e0e0;
      --border-color: #444;
      --accent-color: #4caf50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, "Microsoft YaHei";
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 15px;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 2px 2px #000;
    }

    /* === 顶部控制面板 === */
    .control-panel {
      width: 800px;
      background: var(--panel-bg);
      border: 3px solid var(--border-color);
      border-bottom: none;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .time-display {
      font-size: 22px;
      font-weight: bold;
      color: #ffeb3b;
      background: #000;
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid #555;
      min-width: 240px;
      text-align: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      background: #333;
      color: #fff;
      border: 2px solid #555;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.1s ease;
    }

    button:hover {
      background: #444;
      border-color: #888;
    }

    button.active {
      background: var(--accent-color);
      border-color: #fff;
      color: #000;
      box-shadow: 0 0 8px var(--accent-color);
    }

    .timeline-slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .timeline-slider-container span {
      font-size: 12px;
      color: #aaa;
      min-width: 50px;
    }

    input[type="range"] {
      flex: 1;
      height: 8px;
      background: #111;
      border: 1px solid #444;
      outline: none;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    /* === 游戏舞台画布 === */
    .game-stage {
      width: 800px;
      height: 600px;
      background-color: #34495e;
      /* 像素风网格背景 */
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      position: relative;
      border: 4px solid #444;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
    }

    /* 地标样式 */
    .landmark {
      position: absolute;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      font-weight: bold;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* === 游戏角色 DOM 节点 === */
    .character {
      position: absolute;
      width: 24px;
      height: 32px;
      /* 锚点设在脚底中心，方便配合 Y-Sort 物理遮挡 */
      margin-left: -12px;
      margin-top: -32px;
      border-radius: 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
      border: 2px solid rgba(255,255,255,0.4);
      /* 呼吸动效模拟像素块抖动 */
      animation: breathe 0.6s infinite alternate ease-in-out;
    }

    @keyframes breathe {
      from { transform: scaleY(1); }
      to { transform: scaleY(0.93); }
    }

    /* 角色名字标签 */
    .char-name {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      background: rgba(0,0,0,0.7);
      padding: 1px 4px;
      border-radius: 3px;
      white-space: nowrap;
      color: #fff;
    }

    /* === 精美对话气泡 === */
    .dialogue-bubble {
      position: absolute;
      top: -45px; /* 撑在角色头顶 */
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: #ffffff;
      color: #000000;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      border: 2px solid #000;
      opacity: 0;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.1s linear;
      pointer-events: none;
      z-index: 999999 !important; /* 确保气泡永远在最上层 */
    }

    /* 气泡小箭头 */
    .dialogue-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }
    .dialogue-bubble::before {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 9px 0;
      border-style: solid;
      border-color: #000000 transparent;
      display: block;
      width: 0;
      z-index: -1;
    }

    /* 激活状态的气泡 */
    .dialogue-bubble.show {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    /* === 下方日志控制面板 === */
    .log-panel {
      width: 800px;
      height: 140px;
      background: #111;
      border: 3px solid var(--border-color);
      border-top: none;
      padding: 10px;
      overflow-y: auto;
      font-size: 13px;
      color: #a8ffb2;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-item {
      line-height: 1.4;
      border-left: 3px solid #333;
      padding-left: 8px;
    }
    .log-item.system { color: #888; border-color: #555; }
    .log-item.move { color: #64b5f6; border-color: #2196f3; }
    .log-item.dialogue { color: #ffb74d; border-color: #ff9800; }
    .log-item.action { color: #ba68c8; border-color: #9c27b0; }
  </style>
</head>
<body>

  <h1>AI TOWN 剧场系统（Vanilla JS 离线驱动版）</h1>

  <div class="control-panel">
    <div class="panel-top">
      <div class="time-display" id="timeDisplay">TICK: 0 | 00:00:00</div>
      <div class="btn-group">
        <button id="btnPause" onclick="setSpeed(0)">暂停</button>
        <button id="btn1x" class="active" onclick="setSpeed(1)">1x</button>
        <button id="btn10x" onclick="setSpeed(10)">10x</button>
        <button id="btn100x" onclick="setSpeed(100)">100x</button>
      </div>
    </div>
    <div class="timeline-slider-container">
      <span>Tick 0</span>
      <input type="range" id="timelineSlider" min="0" max="60" value="0" oninput="handleSliderInput(this.value)">
      <span>Tick 60</span>
    </div>
  </div>

  <div class="game-stage" id="gameStage">
    <div class="landmark" style="left: 50px; top: 100px;">家A (张三)</div>
    <div class="landmark" style="left: 700px; top: 100px;">家B (李四)</div>
    <div class="landmark" style="left: 380px; top: 250px;">☕ 咖啡馆</div>
    <div class="landmark" style="left: 380px; top: 500px;">🌳 公园</div>
  </div>

  <div class="log-panel" id="logPanel">
    <div class="log-item system">[系统] 剧本加载完毕，点击倍速开始播放。</div>
  </div>

  <script>
    // ==========================================
    // 1. 内置完整的 Mock 剧本数据
    // ==========================================
    const scriptData = {
      "date": "2026-06-04",
      "config": {
        "tick_interval_seconds": 10,
        "map_regions": {
          "home_zhang": {"x": 50, "y": 100},
          "home_li": {"x": 700, "y": 100},
          "cafe": {"x": 380, "y": 250},
          "park": {"x": 380, "y": 500}
        }
      },
      "characters": {
        "zhangsan": {"name": "张三", "color": "#ff4d4d", "init_region": "home_zhang"},
        "lisi": {"name": "李四", "color": "#3399ff", "init_region": "home_li"}
      },
      "timeline": [
        { "start_tick": 0, "end_tick": 6, "char": "zhangsan", "type": "move", "from": "home_zhang", "to": "cafe", "detail": "张三出门去咖啡馆买早餐" },
        { "start_tick": 3, "end_tick": 12, "char": "lisi", "type": "move", "from": "home_li", "to": "cafe", "detail": "李四慢悠悠地走向咖啡馆" },
        { "start_tick": 8, "end_tick": 11, "char": "zhangsan", "type": "dialogue", "text": "老板，来杯冰美式。咦，李四？你也来啦。" },
        { "start_tick": 12, "end_tick": 15, "char": "lisi", "type": "dialogue", "text": "巧了这不是，我来拿个三明治。你今天气色不错啊。" },
        { "start_tick": 16, "end_tick": 19, "char": "zhangsan", "type": "dialogue", "text": "哈哈还行，等会打算去公园散散步，要一起吗？" },
        { "start_tick": 20, "end_tick": 23, "char": "lisi", "type": "dialogue", "text": "好啊，刚好我今天没什么急事，走着。" },
        { "start_tick": 25, "end_tick": 40, "char": "zhangsan", "type": "move", "from": "cafe", "to": "park", "detail": "张三和李四结伴前往公园" },
        { "start_tick": 25, "end_tick": 40, "char": "lisi", "type": "move", "from": "cafe", "to": "park", "detail": "张三和李四结伴前往公园" },
        { "start_tick": 42, "end_tick": 60, "char": "zhangsan", "type": "action", "detail": "张三坐在公园长椅上晒太阳" },
        { "start_tick": 45, "end_tick": 55, "char": "lisi", "type": "dialogue", "text": "这天气真舒服，适合发呆。" }
      ]
    };

    // ==========================================
    // 2. 状态变量初始化
    // ==========================================
    let currentTick = 0;
    const maxTick = 60;
    let timeScale = 1;         // 默认1倍速
    let isPaused = false;       // 是否暂停
    let mainLoopTimer = null;   // 定时器引用
    
    // 用于去重日志，避免重复渲染
    const loggedEvents = new Set(); 

    // DOM 缓存
    const stage = document.getElementById('gameStage');
    const timeDisplay = document.getElementById('timeDisplay');
    const timelineSlider = document.getElementById('timelineSlider');
    const logPanel = document.getElementById('logPanel');

    // ==========================================
    // 3. 动态初始化并生成人物节点
    // ==========================================
    const charElements = {};

    function initCharacters() {
      for (const [id, info] of Object.entries(scriptData.characters)) {
        const initCoord = scriptData.config.map_regions[info.init_region];
        
        // 创建人物实体 Div
        const charDiv = document.createElement('div');
        charDiv.className = 'character';
        charDiv.id = `char-${id}`;
        charDiv.style.backgroundColor = info.color;
        charDiv.style.left = `${initCoord.x}px`;
        charDiv.style.top = `${initCoord.y}px`;
        charDiv.style.zIndex = Math.floor(initCoord.y); // 初次渲染 Y-Sort

        // 头顶对话气泡
        const bubble = document.createElement('div');
        bubble.className = 'dialogue-bubble';
        bubble.id = `bubble-${id}`;
        charDiv.appendChild(bubble);

        // 脚底名字标签
        const nameLabel = document.createElement('div');
        nameLabel.className = 'char-name';
        nameLabel.innerText = info.name;
        charDiv.appendChild(nameLabel);

        stage.appendChild(charDiv);
        
        // 缓存 DOM 引用
        charElements[id] = {
          entity: charDiv,
          bubble: bubble
        };
      }
    }

    // ==========================================
    // 4. 核心时钟驱动 (Tick Lifecycle)
    // ==========================================
    
    // 将离散的 Tick 单位转换为虚拟时钟字符串
    function tickToTimeString(tick) {
      const totalSeconds = tick * scriptData.config.tick_interval_seconds;
      const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
      const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
      const s = (totalSeconds % 60).toString().padStart(2, '0');
      return `TICK: ${String(tick).padStart(2, '0')} | ${h}:${m}:${s}`;
    }

    // 主时间轴循环
    function startLoop() {
      if (mainLoopTimer) clearTimeout(mainLoopTimer);
      if (isPaused || currentTick > maxTick) return;

      // 执行当前 Tick 触发的剧本
      executeTick(currentTick);

      // 计算下一个 Tick 触发的真实延迟毫秒数
      // 算法：10秒基础延迟 / 倍速变量 -> 转为毫秒
      const nextDelay = (scriptData.config.tick_interval_seconds / timeScale) * 1000;

      mainLoopTimer = setTimeout(() => {
        if (currentTick < maxTick) {
          currentTick++;
          timelineSlider.value = currentTick;
          startLoop();
        } else {
          addLog('system', '[系统] 剧本播放完毕。');
        }
      }, nextDelay);
    }

    // ==========================================
    // 5. 剧本事件解析与 CSS 自动动画注入
    // ==========================================
    function executeTick(tick) {
      // 更新顶部显示
      timeDisplay.innerText = tickToTimeString(tick);

      // 检索当前 Tick 触发的所有事件
      const currentEvents = scriptData.timeline.filter(e => e.start_tick === tick);

      currentEvents.forEach(ev => {
        const charId = ev.char;
        const charName = scriptData.characters[charId].name;
        const dom = charElements[charId];

        // 避免日志重复打印的唯一 Key
        const eventKey = `${ev.type}-${charId}-${ev.start_tick}`;

        if (ev.type === 'move') {
          // 【核心动画补全算法】
          // 1. 计算出该移动跨越了多少个 Tick 的生存周期
          const tickSpan = ev.end_tick - ev.start_tick;
          // 2. 将 Tick 跨度转换为该生命周期在当前倍速下真正的现实物理秒数
          const transitionSeconds = tickSpan * (scriptData.config.tick_interval_seconds / timeScale);

          // 3. 动态向 DOM 注入 CSS transition 属性
          dom.entity.style.transition = `left ${transitionSeconds}s linear, top ${transitionSeconds}s linear`;
          
          // 4. 获取目标终点并赋给绝对定位属性
          const dest = scriptData.config.map_regions[ev.to];
          dom.entity.style.left = `${dest.x}px`;
          dom.entity.style.top = `${dest.y}px`;

          // 5. Y-Sort 渲染：启动过渡后，可以延迟或者直接赋予目标 Y 轴深度的 zIndex 避免错位
          // 这里使用平滑过渡结束后的终点 zIndex，若追求完美可在 requestAnimationFrame 中高频监听
          dom.entity.style.zIndex = Math.floor(dest.y);

          if (!loggedEvents.has(eventKey)) {
            addLog('move', `[移动] ${charName}：${ev.detail} (预计行驶 ${tickSpan}0 秒)`);
            loggedEvents.add(eventKey);
          }
        } 
        
        else if (ev.type === 'dialogue') {
          // 显示对话气泡
          dom.bubble.innerText = ev.text;
          dom.bubble.classList.add('show');

          if (!loggedEvents.has(eventKey)) {
            addLog('dialogue', `[对话] ${charName}：“${ev.text}”`);
            loggedEvents.add(eventKey);
          }
        } 
        
        else if (ev.type === 'action') {
          if (!loggedEvents.has(eventKey)) {
            addLog('action', `[状态] ${charName}：${ev.detail}`);
            loggedEvents.add(eventKey);
          }
        }
      });

      // 检查是否有需要自动关闭隐藏的对话气泡
      scriptData.timeline.forEach(ev => {
        if (ev.type === 'dialogue' && ev.end_tick === tick) {
          charElements[ev.char].bubble.classList.remove('show');
        }
      });
    }

    // ==========================================
    // 6. 进度条拖动机制（时光倒流/快进核心重置逻辑）
    // ==========================================
    function handleSliderInput(targetTick) {
      // 1. 强制阻断当前的定时器生命周期
      if (mainLoopTimer) clearTimeout(mainLoopTimer);
      currentTick = parseInt(targetTick);
      
      // 更新时间盘显示
      timeDisplay.innerText = tickToTimeString(currentTick);

      addLog('system', `[系统] 时光穿梭至第 ${currentTick} Tick`);

      // 2. 【关键步骤】由于是跳转，必须立刻消除所有人物的 CSS 动画过渡效果，否则会出现“全图倒带漂移”
      for (const [id, dom] of Object.entries(charElements)) {
        dom.entity.style.transition = 'none';
        dom.bubble.classList.remove('show'); // 隐藏所有气泡
      }

      // 3. 追溯算法：遍历历史，找出每个角色在此时间戳下最新的空间状态
      for (const charId of Object.keys(scriptData.characters)) {
        const info = scriptData.characters[charId];
        let currentPos = scriptData.config.map_regions[info.init_region]; // 默认始发站
        
        // 按剧本发生顺序检索
        scriptData.timeline.forEach(ev => {
          if (ev.char !== charId) return;

          // 情况 A: 历史移动事件
          if (ev.type === 'move') {
            if (currentTick >= ev.end_tick) {
              // 已经走完了，人物直接落在终点
              currentPos = scriptData.config.map_regions[ev.to];
            } else if (currentTick >= ev.start_tick && currentTick < ev.end_tick) {
              // 刚好卡在移动事件中间！按时间比例进行线性插值计算 (LERP)
              const startPos = scriptData.config.map_regions[ev.from];
              const endPos = scriptData.config.map_regions[ev.to];
              const ratio = (currentTick - ev.start_tick) / (ev.end_tick - ev.start_tick);
              
              currentPos = {
                x: startPos.x + (endPos.x - startPos.x) * ratio,
                y: startPos.y + (endPos.y - startPos.y) * ratio
              };
            }
          }
          
          // 情况 B: 历史对话事件（如果刚好卡在对话生命周期内，让气泡起死回生）
          if (ev.type === 'dialogue') {
            if (currentTick >= ev.start_tick && currentTick < ev.end_tick) {
              charElements[charId].bubble.innerText = ev.text;
              charElements[charId].bubble.classList.add('show');
            }
          }
        });

        // 4. 瞬间传送角色，并重整 Y-Sort 遮挡层级
        const dom = charElements[charId];
        dom.entity.style.left = `${currentPos.x}px`;
        dom.entity.style.top = `${currentPos.y}px`;
        dom.entity.style.zIndex = Math.floor(currentPos.y);
      }

      // 5. 穿梭完毕后，根据当前的暂停状态决定是否继续回滚主循环
      if (!isPaused) {
        startLoop();
      }
    }

    // ==========================================
    // 7. 辅助工具函数 (倍速控制与日志)
    // ==========================================
    function setSpeed(speed) {
      // 样式激活状态切换
      document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
      
      if (speed === 0) {
        isPaused = true;
        document.getElementById('btnPause').classList.add('active');
        if (mainLoopTimer) clearTimeout(mainLoopTimer);
        // 暂停时强制锁死当前 DOM transition 动画
        for (const [id, dom] of Object.entries(charElements)) {
          // 计算当前停留样式，防止角色飘回终点
          const computedStyle = window.getComputedStyle(dom.entity);
          dom.entity.style.left = computedStyle.left;
          dom.entity.style.top = computedStyle.top;
          dom.entity.style.transition = 'none';
        }
        addLog('system', '[系统] 剧场已暂停');
      } else {
        isPaused = false;
        timeScale = speed;
        if (speed === 1) document.getElementById('btn1x').classList.add('active');
        if (speed === 10) document.getElementById('btn10x').classList.add('active');
        if (speed === 100) document.getElementById('btn100x').classList.add('active');
        
        addLog('system', `[系统] 切换至 ${speed} 倍速`);
        
        // 重新计算并注入当前执行 Tick 的运动 Transition 动画
        //（通过重新运行当前 Tick 刷新 transition 秒数）
        executeTick(currentTick);
        startLoop();
      }
    }

    function addLog(type, text) {
      const item = document.createElement('div');
      item.className = `log-item ${type}`;
      item.innerText = text;
      logPanel.appendChild(item);
      // 日志面板自动滚到底部
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    // 页面加载完成后自动开幕
    window.onload = () => {
      initCharacters();
      startLoop();
    };
  </script>
</body>
</html>
